[project]
name = "youtube-mcp"
version = "0.1.0"
description = "MCP server for authenticated YouTube writes: uploads, captions, playlists. Wraps the proven yt_write.py CLI rather than reimplementing its guards."
authors = [{ name = "Brent Peterson" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.8.0,<2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.30.0",
]

[project.scripts]
youtube-mcp = "youtube_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/"]
